[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cloud-architecture"
version = "0.2.0"
description = "Offline-first agent architecture workbench with local and AWS targets"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hf = ["huggingface_hub>=0.30,<2"]

[project.scripts]
agent-arch = "agent_arch.workbench:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_arch*"]
