name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_arch validate architectures/aws-queue-worker.json
      - run: python -m agent_arch guard architectures/aws-queue-worker.json
      - run: python -m agent_arch compare architectures/local-direct.json architectures/local-retry.json
